<!doctype html>
<!-- THROWAWAY: Three structurally different Ambient Card candidates on one route via ?variant=A|B|C.
     Browser-only design artifact beside existing firmware mockups, never part of the firmware build.
     Run: python3 -m http.server 8765 --directory Firmware/docs/design/mockups/retro-pixel-prototype -->
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini TV · 复古像素氛围卡预览</title>
<style>
:root{color-scheme:dark;--paper:#e5ddc9;--muted:#a9a99e;--accent:#d8b47b}
*{box-sizing:border-box}body{margin:0;background:#171c1d;color:var(--paper);font:15px/1.7 system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}a{color:var(--accent)}
header{max-width:1120px;margin:0 auto;padding:36px 24px 20px;display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.eyebrow{font:11px/1.6 monospace;letter-spacing:3px;color:var(--accent)}h1{font-size:30px;font-weight:500;letter-spacing:2px;margin:12px 0 8px}header p{margin:0;color:var(--muted);font-size:13px}.badge{font:11px monospace;border:1px solid #48504a;padding:7px 12px;white-space:nowrap}
main{max-width:1120px;margin:auto;padding:12px 24px 132px}.preview-layout{display:grid;grid-template-columns:minmax(0,680px) 1fr;gap:44px;align-items:center}.device{display:flex;justify-content:center;align-items:center;min-height:506px}.bezel{display:inline-flex;padding:12px;background:#090e11;border:2px solid #3d4544;border-radius:8px}.bezel canvas{display:block;width:640px;height:480px;image-rendering:pixelated}.native .bezel canvas{width:320px;height:240px}.native .device{min-height:506px}.caption{text-align:center;color:var(--muted);font-size:11px;margin:10px 0 0;letter-spacing:1px}.meta h2{font-size:28px;font-weight:500;margin:12px 0}.meta .intro{color:#c6c8bb}.details{border-top:1px solid #3b4340;padding:16px 0;margin:24px 0;font-size:13px;color:var(--muted)}.details p{margin:6px 0}.details b{color:var(--paper);font-weight:500}.controls{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}.controls button{background:transparent;border:1px solid #56605a;padding:6px 12px;border-radius:3px}.controls label{display:flex;align-items:center;gap:6px}.note{font-size:12px;color:var(--muted);margin-top:16px}.state{margin-top:28px;border-top:1px solid #35413d;padding-top:12px;font:11px/1.6 monospace;color:#8eaa99;white-space:pre-wrap}.options{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}.options button{padding:7px 14px;background:transparent;border:1px solid #434d47;border-radius:3px;font-size:12px}.options button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.switcher{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:20px;padding:8px;background:#e4ddc9;color:#25332e;border:1px solid #e4ddc9;border-radius:6px;box-shadow:0 8px 30px #0008;z-index:2}.switcher button{border:0;background:#cbc8b6;width:42px;height:36px;border-radius:3px;font-size:22px}.switcher span{min-width:186px;text-align:center;font-size:13px}.switcher small{display:block;font:9px monospace;letter-spacing:2px;color:#59665b}.comparison{display:none}.compare .preview-layout,.compare .caption,.compare .options,.compare .switcher{display:none}.compare .comparison{display:grid;grid-template-columns:repeat(3,320px);gap:32px;justify-content:center;margin-top:32px}.comparison canvas{width:320px;height:240px;display:block;image-rendering:pixelated;outline:8px solid #0a1011}.comparison h2{font-size:18px;font-weight:500;margin-top:22px}.comparison p{font-size:12px;color:var(--muted);max-width:290px}.compare main{max-width:1150px;padding-bottom:24px}.comparison-footer{grid-column:1/-1;border-top:1px solid #3b4340;padding-top:16px;color:var(--muted);font-size:12px}
@media(max-width:1050px){.preview-layout{display:block}.meta{max-width:640px;margin:28px auto}.device{min-height:0}.bezel canvas{max-width:100%;height:auto}.bezel{max-width:100%}.native .device{min-height:0}.compare .comparison{grid-template-columns:320px}.comparison-footer{grid-column:1}}
@media(max-width:520px){header{padding:24px 18px 12px}.badge{display:none}h1{font-size:24px}main{padding:12px 18px 124px}.bezel{padding:6px}.native .bezel canvas{max-width:100%;height:auto}.switcher{gap:10px;bottom:14px}.switcher span{min-width:160px}}
</style>
</head>
<body>
<header><div><div class="eyebrow">MINI TV / AMBIENT STUDIES</div><h1>一方像素，小小世界。</h1><p>复古像素氛围卡 · 三个候选构图，不是三张功能卡</p></div><div class="badge">THROWAWAY PROTOTYPE · 320 × 240</div></header>
<main>
<div class="preview-layout"><section><div class="device"><div class="bezel"><canvas id="screen" width="320" height="240" role="img"></canvas></div></div><p class="caption">屏内为实际 320 × 240 横屏比例 · 边框仅用于区分画面，不代表硬件改版</p></section>
<section class="meta"><div class="eyebrow" id="variant-code"></div><h2 id="name"></h2><p class="intro" id="description"></p><div class="details"><p><b>画面主角</b>　<span id="subject"></span></p><p><b>时间位置</b>　<span id="clock-position"></span></p><p><b>小幅动效候选</b>　<span id="motion-detail"></span></p></div><div class="controls"><button id="scale" type="button">查看 1× 像素尺寸</button><label><input id="motion" type="checkbox">预览局部动态</label></div><p class="note">演示时间固定为 20:48。默认静态、不会自动换图；可选动态只是构图讨论，不代表真机帧率。下方切换条是预览工具，不上设备。</p><pre id="state" class="state" aria-live="polite"></pre></section></div>
<div class="options" aria-label="构图候选"><button data-variant="A">A · 暖灯小屋</button><button data-variant="B">B · 黄昏旷野</button><button data-variant="C">C · 像素小伙伴</button><a href="?compare=1" style="font-size:12px;padding:7px 0">并排对比</a></div>
<div class="comparison" id="comparison"></div>
</main>
<nav class="switcher" aria-label="原型方案切换"><button id="prev" aria-label="上一个方案">←</button><span><small>PROTOTYPE SWITCHER</small><strong id="switch-label"></strong></span><button id="next" aria-label="下一个方案">→</button></nav>
<script type="module">
import {drawScene as drawRoom} from './scene-warm-room.js';
import {drawScene as drawLandscape} from './scene-landscape.js';
import {drawScene as drawCompanion} from './scene-companion.js';
const variants = {
 A:{name:'暖灯小屋',english:'A / LITTLE ROOM',description:'把屏幕当成一扇望进小房间的窗。暖灯、桌面和一只睡着的猫，让它像一直有人住着。',subject:'房间的生活细节',position:'右上角，小字退后',motion:'杯口热气，画面其余部分静止',draw:drawRoom,clock:[266,16],color:'#eddfb3'},
 B:{name:'黄昏旷野',english:'B / SLOW LANDSCAPE',description:'不挤信息，留一整片天空。远山、河流和一盏小屋的灯，更像桌上的像素风景画。',subject:'开阔的天空与远景',position:'左上角，融入天空',motion:'少量水面亮点，不移动整幅风景',draw:drawLandscape,clock:[16,16],color:'#513e55'},
 C:{name:'像素小伙伴',english:'C / TINY COMPANION',description:'一台安静陪你的迷你 CRT 小机器人。留白围着它展开，时间放在脚下，不加指标与按钮。',subject:'居中的单个像素角色',position:'下方居中，像一行小落款',motion:'偶尔眨眼，不做循环大动作',draw:drawCompanion,clock:[142,202],color:'#d7dab2'}
};
const glyphs={'0':['111','101','101','101','111'],'1':['010','110','010','010','111'],'2':['111','001','111','100','111'],'3':['111','001','111','001','111'],'4':['101','101','111','001','001'],'5':['111','100','111','001','111'],'6':['111','100','111','101','111'],'7':['111','001','010','010','010'],'8':['111','101','111','101','111'],'9':['111','101','111','001','111'],':':['0','1','0','1','0'],'.':['0','0','0','0','1']};
function pixelText(ctx,text,x,y,scale,color){ctx.fillStyle=color;for(const letter of text){const rows=glyphs[letter];rows.forEach((row,dy)=>[...row].forEach((bit,dx)=>{if(bit==='1')ctx.fillRect(x+dx*scale,y+dy*scale,scale,scale)}));x+=(rows[0].length+1)*scale;}}
function paint(canvas,key,frame=0){const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;const variant=variants[key];variant.draw(ctx,frame);const[x,y]=variant.clock;pixelText(ctx,'20:48',x,y,2,variant.color);pixelText(ctx,'09.12',x+9,y+15,1,variant.color);}
const keys=Object.keys(variants),params=new URLSearchParams(location.search);let current=keys.includes(params.get('variant'))?params.get('variant'):'A',frame=0,moving=false,native=false;
const screen=document.querySelector('#screen'),motion=document.querySelector('#motion');
function showState(){document.querySelector('#state').textContent=JSON.stringify({variant:current,scene:variants[current].name,resolution:'320×240',time:'20:48 (演示)',date:'09.12 (演示)',motion:moving?'局部候选 / 浏览器 2 Hz':'静态',automaticRotation:false,hardwarePerformance:'未验证'},null,2);}
function render(){const v=variants[current];paint(screen,current,frame);screen.setAttribute('aria-label',v.name+'像素场景，辅以演示时间20:48');document.querySelector('#variant-code').textContent=v.english;document.querySelector('#name').textContent=v.name;document.querySelector('#description').textContent=v.description;document.querySelector('#subject').textContent=v.subject;document.querySelector('#clock-position').textContent=v.position;document.querySelector('#motion-detail').textContent=v.motion;document.querySelector('#switch-label').textContent=current+' · '+v.name;document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.variant===current)));showState();}
function choose(key){current=key;frame=0;const url=new URL(location.href);url.searchParams.set('variant',key);history.replaceState(null,'',url);render();}
function cycle(step){choose(keys[(keys.indexOf(current)+step+keys.length)%keys.length]);}
document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>choose(b.dataset.variant));
document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,[contenteditable]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();cycle(event.key==='ArrowLeft'?-1:1);}});
motion.onchange=()=>{moving=motion.checked;frame=0;render();};document.querySelector('#scale').onclick=event=>{native=!native;document.body.classList.toggle('native',native);event.target.textContent=native?'查看 2× 放大':'查看 1× 像素尺寸';};
setInterval(()=>{if(moving&&!document.hidden&&!params.has('compare')){frame++;paint(screen,current,frame);}},500);
window.addEventListener('popstate',()=>{const key=new URLSearchParams(location.search).get('variant');current=keys.includes(key)?key:'A';frame=0;render();});
if(params.has('compare')){document.body.classList.add('compare');const grid=document.querySelector('#comparison');for(const key of keys){const section=document.createElement('section'),canvas=document.createElement('canvas');canvas.width=320;canvas.height=240;canvas.setAttribute('role','img');canvas.setAttribute('aria-label',variants[key].name);const title=document.createElement('h2'),description=document.createElement('p');title.textContent=key+' · '+variants[key].name;description.textContent=variants[key].description;section.append(canvas,title,description);grid.append(section);paint(canvas,key);}const footer=document.createElement('div');footer.className='comparison-footer';footer.textContent='同一张氛围卡的三个候选 · 屏内均为 320×240 · 演示时间 20:48 · 默认静态，不自动轮播 · 尚未选定，不代表真机渲染效果或帧率';grid.append(footer);}
render();
</script>
</body>
</html>
